<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ACE AI 3D Live Desktop</title>
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">
  {
    "imports": {
      "three": "../node_modules/three/build/three.module.js",
      "three/addons/": "../node_modules/three/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="avatar.js"></script>
  <script src="sfx.js"></script>
  <script src="ai-agent.js"></script>
</head>
<body>
  <div id="wallpaper-root">
    <div id="laser-scan-line"></div>
    <canvas id="canvas3d"></canvas>

    <div id="hud-layer">
      <!-- Top Bar -->
      <div class="top-bar">
        <div class="clock-widget">
          <div class="time-text" id="live-time">--:--:--</div>
          <div class="date-text" id="live-date">Syncing hardware telemetry...</div>
        </div>

        <div class="system-widget">
          <div class="sys-card">
            <span class="sys-label">CPU LOAD</span>
            <span class="sys-val" id="sys-cpu">--%</span>
          </div>
          <div class="sys-card">
            <span class="sys-label">BATTERY</span>
            <span class="sys-val" id="sys-battery">--%</span>
          </div>
          <div class="sys-card">
            <span class="sys-label">FREE RAM</span>
            <span class="sys-val" id="sys-ram">-- GB</span>
          </div>
          <div class="sys-card">
            <span class="sys-label">FREE DISK</span>
            <span class="sys-val" id="sys-disk">-- GB</span>
          </div>
          <button class="win-mode-btn" id="mode-btn" title="Toggle Floating Hologram / Fullscreen Mode">🪟 Mode</button>
          <button class="win-exit-btn" id="exit-btn" title="Exit Wallpaper">✕</button>
        </div>
      </div>

      <!-- Dialogue Bubble Overlay -->
      <div id="dialogue-container">
        <div class="bubble bot" id="main-bubble">
          At your service, sir. Systems online and fully operational. How can I assist you today?
        </div>
      </div>

      <!-- Bottom Interactive Dock -->
      <div class="bottom-dock">
        <div class="dock-controls">
          <div>
            <label for="model-select">Neural Core: </label>
            <select id="model-select">
              <option value="qwen:latest" selected>Qwen (Fast / Low Latency)</option>
              <option value="llama3.1:latest">Llama 3.1 (8B)</option>
              <option value="llava:latest">LLaVA (Vision)</option>
            </select>
          </div>

          <div class="waveform" id="waveform">
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
          </div>
        </div>

        <div class="quick-actions">
          <button class="action-chip" id="chip-vision" title="Scan & Analyze Current Screen with Vision AI">👁️ Scan Screen</button>
          <button class="action-chip" id="chip-weather" title="Check Current Weather">🌤️ Weather</button>
          <button class="action-chip" id="chip-vol-up" title="Volume Up">🔊 Vol +</button>
          <button class="action-chip" id="chip-vol-down" title="Volume Down">🔉 Vol -</button>
          <button class="action-chip" id="chip-vol-mute" title="Toggle Mute">🔇 Mute</button>
          <button class="action-chip" id="chip-media" title="Play/Pause Media">⏯️ Media</button>
          <button class="action-chip" id="chip-screenshot" title="Capture Desktop Screenshot">📸 Screenshot</button>
          <button class="action-chip" id="chip-lock" title="Lock Workstation">🔒 Lock PC</button>
        </div>

        <div class="input-row">
          <button id="mic-btn" title="Click to Speak into Microphone">🎙️</button>
          <input type="text" id="text-input" placeholder="Speak or type a command (e.g. 'Open Chrome and Spotify')..." autocomplete="off">
          <button id="send-btn" title="Send">➤</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
